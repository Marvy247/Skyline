[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
  "solmate/=lib/solmate/",
]

# Scripts deploy the whole stack, including v4-core's PoolManager. At the 1,000,000-run
# default the PoolManager exceeds EIP-170 (26,947 bytes), so deployments use a size-oriented
# profile: `FOUNDRY_PROFILE=deploy forge script ...`.
[profile.deploy]
optimizer_runs = 200

[profile.default.fuzz]
runs = 10000

[profile.default.invariant]
# Every invariant is meaningful at this depth. CI raises `runs` to 10000.
runs = 2000
depth = 50
fail_on_revert = false

[profile.ci.invariant]
runs = 10000
depth = 100
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
