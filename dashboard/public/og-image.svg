<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b1220" />

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#10b981" stroke-opacity="0.10" stroke-width="1" />
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="980" cy="150" r="320" fill="url(#glow)" />

  <!-- Mark: depositor capital dominant, curator bond subordinate -->
  <g transform="translate(110 92)">
    <rect width="112" height="112" rx="28" fill="#0c4a6e" />
    <circle cx="56" cy="56" r="34" stroke="url(#ring)" stroke-width="9" fill="none" stroke-opacity="0.95" />
    <circle cx="56" cy="56" r="18" fill="#ffffff" fill-opacity="0.94" />
    <path d="M56 15 L56 29" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Copy -->
  <text x="110" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#title)">SKYLINE</text>
  <text x="112" y="356" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#cbd5e1">Curator Exit Parity for Uniswap v4</text>
  <text x="112" y="448" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">The curator cannot run.</text>
  <text x="112" y="505" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Bonded curator capital. Hook-enforced exit priority. Loss absorption.</text>

  <!-- Footer rule and labels -->
  <rect x="112" y="556" width="976" height="1" fill="#1e293b" />
  <text x="112" y="592" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">UHI11 · Active Management and Curation</text>
  <text x="1088" y="592" text-anchor="end" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">Base Sepolia · Uniswap v4 · Chainlink</text>
</svg>
